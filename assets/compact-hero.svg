<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-label="Hung - Full-Stack &amp; AI Automation Developer">
  <title>Hung - Full-Stack &amp; AI Automation Developer</title>
  <defs>
    <clipPath id="r"><rect width="1000" height="330" rx="28"/></clipPath>
    <filter id="blur" x="-20%" y="-90%" width="140%" height="280%"><feGaussianBlur stdDeviation="46"/></filter>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="620" y2="0">
      <stop offset="0" stop-color="#6ab0ff"/>
      <stop offset=".5" stop-color="#b784ff"/>
      <stop offset="1" stop-color="#ff7a9c"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .d1 { animation: d1 13s ease-in-out infinite alternate; }
    .d2 { animation: d2 17s ease-in-out infinite alternate; }
    .d3 { animation: d3 15s ease-in-out infinite alternate; }
    .d4 { animation: d4 19s ease-in-out infinite alternate; }
    @keyframes d1 { from { transform: translateX(-60px); } to { transform: translateX(70px); } }
    @keyframes d2 { from { transform: translateX(60px); }  to { transform: translateX(-80px); } }
    @keyframes d3 { from { transform: translateX(-70px); } to { transform: translateX(50px); } }
    @keyframes d4 { from { transform: translateX(40px); }  to { transform: translateX(-60px); } }
    .dot { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  </style>

  <g clip-path="url(#r)">
    <rect width="1000" height="330" fill="#000"/>

    <g filter="url(#blur)" opacity=".92">
      <ellipse class="d1" cx="220" cy="350" rx="230" ry="80" fill="#0a84ff"/>
      <ellipse class="d2" cx="470" cy="362" rx="270" ry="88" fill="#bf5af2"/>
      <ellipse class="d3" cx="730" cy="350" rx="240" ry="80" fill="#ff375f"/>
      <ellipse class="d4" cx="920" cy="362" rx="190" ry="72" fill="#ff9f0a"/>
    </g>

    <text class="t" x="500" y="124" text-anchor="middle" font-size="94" font-weight="700" letter-spacing="-3" fill="url(#name)">Hung</text>
    <text class="t" x="500" y="180" text-anchor="middle" font-size="34" font-weight="500" fill="#f5f5f7">Full-Stack &amp; AI Automation Developer.</text>
    <text class="t" x="500" y="219" text-anchor="middle" font-size="20" fill="#86868b">Ho Chi Minh City, Vietnam<tspan dx="14" fill="#48484a">|</tspan><tspan dx="14" fill="#30d158" class="dot">&#9679;</tspan><tspan dx="6">Open to freelance work</tspan></text>
  </g>
</svg>
