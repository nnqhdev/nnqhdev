<svg xmlns="http://www.w3.org/2000/svg" width="496" height="560" viewBox="0 0 496 560" role="img" aria-label="AI assistants: chatbots and LLM apps with RAG and agents, running 24/7">
  <title>AI assistants</title>
  <defs>
    <clipPath id="r"><rect width="496" height="560" rx="28"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2fc"/>
      <stop offset="1" stop-color="#c9ddf3"/>
    </linearGradient>
    <radialGradient id="hi" cx=".5" cy="0" r=".9">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0a2a55" flood-opacity=".14"/>
    </filter>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .b1 { animation: b1 10s ease-out infinite; }
    .b2 { animation: b2 10s ease-out infinite; }
    .b3 { animation: b3 10s ease-out infinite; }
    @keyframes b1 { 0% { opacity: 0; transform: translateY(12px); } 6%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes b2 { 0%, 22% { opacity: 0; transform: translateY(12px); } 29%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes b3 { 0%, 50% { opacity: 0; transform: translateY(12px); } 57%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    .dot { animation: bn 1.2s ease-in-out infinite; }
    @keyframes bn { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-6px); opacity: 1; } }
  </style>

  <g clip-path="url(#r)">
    <rect width="496" height="560" fill="url(#bg)"/>
    <rect width="496" height="360" fill="url(#hi)"/>

    <text class="t" x="248" y="92" text-anchor="middle" font-size="38" font-weight="600" letter-spacing="-.8" fill="#1d1d1f">AI assistants.</text>
    <text class="t" x="248" y="130" text-anchor="middle" font-size="20" fill="#515154">Chatbots &amp; LLM apps (RAG, agents), 24/7.</text>

    <!-- user message -->
    <g class="b1" filter="url(#sh)">
      <rect x="166" y="206" width="294" height="56" rx="28" fill="#0a84ff"/>
      <text class="t" x="313" y="240" text-anchor="middle" font-size="19" font-weight="500" fill="#ffffff">Summarize today's tickets</text>
    </g>

    <!-- assistant message -->
    <g class="b2" filter="url(#sh)">
      <rect x="36" y="286" width="322" height="106" rx="28" fill="#ffffff"/>
      <text class="t" x="62" y="328" font-size="20" font-weight="600" fill="#1d1d1f">12 tickets, 3 urgent.</text>
      <text class="t" x="62" y="362" font-size="19" fill="#6e6e73">Replies drafted for all.</text>
    </g>

    <!-- typing -->
    <g class="b3" filter="url(#sh)">
      <rect x="36" y="414" width="92" height="48" rx="24" fill="#ffffff"/>
      <circle class="dot" cx="64"  cy="438" r="5" fill="#86868b"/>
      <circle class="dot" cx="82"  cy="438" r="5" fill="#86868b" style="animation-delay:.15s"/>
      <circle class="dot" cx="100" cy="438" r="5" fill="#86868b" style="animation-delay:.3s"/>
    </g>
  </g>
</svg>
