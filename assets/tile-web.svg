<svg xmlns="http://www.w3.org/2000/svg" width="496" height="560" viewBox="0 0 496 560" role="img" aria-label="Web and mobile apps: modern, scalable and production-ready">
  <title>Web &amp; mobile apps</title>
  <defs>
    <clipPath id="r"><rect width="496" height="560" rx="28"/></clipPath>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0a84ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .fl  { animation: fl 6s ease-in-out infinite alternate; }
    .fl2 { animation: fl 7s ease-in-out infinite alternate-reverse; }
    @keyframes fl { from { transform: translateY(0); } to { transform: translateY(-9px); } }
    .sh { animation: sh 2.8s ease-in-out infinite alternate; }
    @keyframes sh { from { opacity: .55; } to { opacity: 1; } }
  </style>

  <g clip-path="url(#r)">
    <rect width="496" height="560" fill="#000"/>
    <rect y="300" width="496" height="260" fill="url(#glow)"/>

    <text class="t" x="248" y="92" text-anchor="middle" font-size="38" font-weight="600" letter-spacing="-.8" fill="#f5f5f7">Web &amp; mobile apps.</text>
    <text class="t" x="248" y="130" text-anchor="middle" font-size="20" fill="#a1a1a6">Modern, scalable and production-ready.</text>

    <!-- browser window -->
    <g class="fl">
      <rect x="34" y="214" width="340" height="256" rx="16" fill="#1c1c1e" stroke="#3a3a3c"/>
      <circle cx="56" cy="236" r="5" fill="#ff5f57"/>
      <circle cx="74" cy="236" r="5" fill="#febc2e"/>
      <circle cx="92" cy="236" r="5" fill="#28c840"/>
      <rect x="120" y="226" width="200" height="20" rx="10" fill="#2c2c2e"/>
      <line x1="34" y1="258" x2="374" y2="258" stroke="#2c2c2e"/>

      <rect class="sh" x="58" y="282" width="176" height="20" rx="10" fill="url(#g)"/>
      <rect x="58" y="318" width="262" height="9"  rx="4.5" fill="#3a3a3c"/>
      <rect x="58" y="337" width="214" height="9"  rx="4.5" fill="#3a3a3c"/>

      <rect x="58"  y="378" width="88" height="70" rx="12" fill="#2c2c2e"/>
      <rect x="158" y="378" width="88" height="70" rx="12" fill="#2c2c2e"/>
      <rect x="258" y="378" width="88" height="70" rx="12" fill="#2c2c2e"/>
      <circle cx="80"  cy="402" r="9" fill="#0a84ff"/>
      <circle cx="180" cy="402" r="9" fill="#bf5af2"/>
      <circle cx="280" cy="402" r="9" fill="#ff9f0a"/>
      <rect x="70"  y="424" width="52" height="7" rx="3.5" fill="#48484a"/>
      <rect x="170" y="424" width="52" height="7" rx="3.5" fill="#48484a"/>
      <rect x="270" y="424" width="52" height="7" rx="3.5" fill="#48484a"/>
    </g>

    <!-- phone -->
    <g class="fl2">
      <rect x="338" y="290" width="124" height="236" rx="26" fill="#000" stroke="#636366" stroke-width="3"/>
      <rect x="378" y="302" width="44" height="13" rx="6.5" fill="#1c1c1e"/>
      <rect class="sh" x="354" y="336" width="92" height="14" rx="7" fill="url(#g)"/>
      <rect x="354" y="362" width="76" height="7" rx="3.5" fill="#3a3a3c"/>
      <rect x="354" y="378" width="60" height="7" rx="3.5" fill="#3a3a3c"/>
      <rect x="354" y="404" width="92" height="52" rx="12" fill="#2c2c2e"/>
      <rect x="354" y="466" width="92" height="38" rx="12" fill="#1c1c1e"/>
    </g>
  </g>
</svg>
