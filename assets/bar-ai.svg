<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="112" viewBox="0 0 1000 112" role="img" aria-label="AI assistants - click to expand">
  <title>AI assistants</title>
  <defs>
    <clipPath id="r"><rect width="1000" height="112" rx="26"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2fc"/>
      <stop offset="1" stop-color="#cfe1f5"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .halo { animation: halo 2.6s ease-out infinite; transform-origin: 878px 56px; }
    @keyframes halo { 0% { opacity: .55; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
  </style>
  <g clip-path="url(#r)">
    <rect width="1000" height="112" fill="url(#bg)"/>
    <text class="t" x="44" y="55" font-size="38" font-weight="600" letter-spacing="-.8" fill="#1d1d1f">AI assistants</text>
    <text class="t" x="44" y="87" font-size="21" fill="#515154">Chatbots and LLM apps with RAG and agents, 24/7.</text>

    <rect class="halo" x="803" y="34" width="150" height="44" rx="22" fill="#0071e3"/>
    <rect x="803" y="34" width="150" height="44" rx="22" fill="#0071e3"/>
    <text class="t" x="878" y="63" text-anchor="middle" font-size="21" font-weight="500" fill="#ffffff">Explore +</text>
  </g>
</svg>