<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-label="Hung - Full-Stack &amp; AI Automation Developer">
  <title>Hung - Full-Stack &amp; AI Automation Developer</title>
  <defs>
    <clipPath id="round"><rect width="1000" height="390" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .2; } }
  </style>

  <g clip-path="url(#round)">
    <!-- three equal bands: black / gray / white -->
    <rect y="0"   width="1000" height="130" fill="#0b0b0b"/>
    <rect y="130" width="1000" height="130" fill="#858585"/>
    <rect y="260" width="1000" height="130" fill="#f2f2f2"/>

    <!-- 01 -->
    <text class="mono" x="952" y="38" text-anchor="end" font-size="14" letter-spacing="2" fill="#858585">01</text>
    <text class="sans" x="48" y="98" font-size="92" font-weight="800" letter-spacing="-2" fill="#ffffff" textLength="236" lengthAdjust="spacingAndGlyphs">Hung</text>
    <rect class="blink" x="302" y="32" width="20" height="66" fill="#ffffff"/>

    <!-- 02 -->
    <text class="mono" x="952" y="168" text-anchor="end" font-size="14" letter-spacing="2" fill="#0b0b0b" fill-opacity=".6">02</text>
    <text class="sans" x="48" y="208" font-size="38" font-weight="700" fill="#0b0b0b">Full-Stack &amp; AI Automation Developer</text>

    <!-- 03 -->
    <text class="mono" x="952" y="298" text-anchor="end" font-size="14" letter-spacing="2" fill="#0b0b0b" fill-opacity=".5">03</text>
    <circle class="pulse" cx="56" cy="326" r="7" fill="#0b0b0b"/>
    <text class="sans" x="78" y="336" font-size="28" font-weight="600" fill="#0b0b0b">Ho Chi Minh City, Vietnam<tspan dx="14" fill-opacity=".45">/</tspan><tspan dx="14">Open to freelance work</tspan></text>
  </g>
</svg>
