<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-label="I build web apps, AI assistants and automation that help teams move faster. Turning ideas into practical, production-ready software.">
  <title>About</title>
  <defs>
    <clipPath id="r"><rect width="1000" height="460" rx="28"/></clipPath>
  </defs>
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  </style>

  <g clip-path="url(#r)">
    <rect width="1000" height="460" fill="#f5f5f7"/>

    <text class="t" x="500" y="78" text-anchor="middle" font-size="24" font-weight="600" fill="#1d1d1f">Hello.</text>

    <g class="t" text-anchor="middle" font-size="46" font-weight="600" letter-spacing="-1">
      <text x="500" y="152" fill="#1d1d1f">I build web apps, AI assistants</text>
      <text x="500" y="210" fill="#1d1d1f">and automation that help</text>
      <text x="500" y="268" fill="#1d1d1f">teams move faster.</text>
      <text x="500" y="326" fill="#a1a1a6">Turning ideas into practical,</text>
      <text x="500" y="384" fill="#a1a1a6">production-ready software.</text>
    </g>

    <text class="t" x="500" y="430" text-anchor="middle" font-size="19" fill="#86868b">Bachelor of Engineering in Data Engineering</text>
  </g>
</svg>
