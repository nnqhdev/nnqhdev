name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: nnqhdev
          outputs: |
            dist/snake-dark.svg?color_snake=#ffffff&color_dots=#1c1c1c,#444444,#777777,#aaaaaa,#e8e8e8
            dist/snake.svg?color_snake=#0b0b0b&color_dots=#ececec,#c8c8c8,#999999,#666666,#222222

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
